site_name: Django Commons
repo_url: https://github.com/django-commons/django-commons.github.io
markdown_extensions:
  - toc:
      permalink: "#"
plugins:
  - blog:
      blog_dir: blog
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
theme:
  name: material
nav:
  - Home: index.md
  - Blog: blog/index.md
  - FAQ: faq.md
  - Funding: funding.md
  - Governance: governance.md
  - Media: media.md
  - Team: team.md
  - Values: values.md
